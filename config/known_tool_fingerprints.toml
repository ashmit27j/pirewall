# Seed list of publicly documented JA3 (TLS ClientHello) fingerprints for
# known attack/exploitation tooling (ADDENDUM_2.md B5).
#
# HONEST LIMITATION, stated plainly rather than glossed over: this list
# needs an ongoing maintenance process to stay useful. JA3 hashes shift
# whenever a tool's underlying TLS library/version changes, and this
# particular public source is, by its own admission, a snapshot from
# several years ago rather than a continuously updated feed. Treat this as
# illustrative starter coverage of *known, unmodified* tooling, not a
# comprehensive or current attack-tool database — see
# pirewall/detection/tls_fingerprint.py's module docstring for the fuller
# limitation (an attacker who randomizes their TLS stack trivially evades
# this).
#
# Source: trisulnsm/ja3prints, a long-standing, widely-cited open-source
# JA3 fingerprint database — https://github.com/trisulnsm/ja3prints
# (file: ja3fingerprint.json). Every `hash`/`tool`/`tested` value below is
# copied verbatim from that source, not invented; `tested` is that file's
# own description of which tool version/OS produced the hash.
#
# Entries deliberately NOT seeded here: generic HTTP client libraries
# (curl, Python Requests, wget) also appear in public JA3 lists, but they
# are used by an enormous amount of ordinary, legitimate traffic (health
# checks, IoT devices, scripted API clients) — seeding them here would
# make this list a source of false positives rather than attack-tool
# signal, so only entries whose tool is itself a security scanner or
# exploitation framework are included.

