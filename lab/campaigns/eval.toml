target = "victim"
side = "forward"
duration = 60
args = ["--timing", "T4", "--ports", "1-1024"]
victim_filter = { proto = "tcp" }

[[attack]]
id = "vertical_scan_t3"
script = "nmap_vertical.sh"
runs = 5
target = "victim"
side = "forward"
duration = 90
args = ["--timing", "T3", "--ports", "1-1024"]
victim_filter = { proto = "tcp" }

[[attack]]
