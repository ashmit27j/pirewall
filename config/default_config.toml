# pirewall default configuration (spec §37)
#
# This file ships with placeholder values only. Anything marked CHANGE_ME or
# using an obviously-placeholder value ("eth0", "192.0.2.x" test-net-1
# addresses, etc.) MUST be replaced with your real network layout before
# deployment. Do not commit real Admin PC IPs, real interface names, or any
# secret to this file — use `config/local_config.toml` (gitignored) or an
# environment-specific copy instead.

[network]
# Real interface names go here once you know your Pi's actual NIC layout.
wan_interface = "eth0"          # CHANGE_ME — placeholder only
lan_interface = "eth1"          # CHANGE_ME — placeholder only
protected_network = "192.0.2.0/24"   # CHANGE_ME — TEST-NET-1 placeholder, not a real LAN
upstream_gateway = "192.0.2.1"       # CHANGE_ME — the home router (WAN side of the Pi)
# The Pi's OWN LAN-facing address: the default gateway LAN clients route
# through, and the address the Admin PC reaches the control panel on.
# Safety validation refuses to ever block this (spec §24 "never block
# pirewall itself / management access"), so it must be accurate.
pirewall_lan_ip = "192.0.2.2"        # CHANGE_ME — placeholder only

[capture]
interface = "eth1"              # CHANGE_ME — must match the interface facing the protected LAN
snap_len = 65535
promiscuous = true
buffer_size_bytes = 2097152
# "auto": native TPACKET_V3 ring + Rust flow table when pirewall-native is
# installed (uv sync --extra native), else the pure-Python path.
backend = "auto"
ring_block_size_bytes = 1048576
ring_block_count = 16
ring_block_timeout_ms = 50
# Native path: per-drain conversion caps; excess is shed and counted.
native_max_flows_per_drain = 1000
native_max_new_flows_per_drain = 5000
# Native engine panics (caught, ADDENDUM_4.md D6) tolerated within 60 s
# before falling back to the Python path with a CRITICAL event.
native_max_panics_per_minute = 5
# backend = "replay" (ADDENDUM_4.md D7) replays pcaps through the same flow
# engine with no root and no NIC (pirewall/capture/replay.py, phase 15).
# pirewall-core selects it from this setting from phase 16 on.
# replay_path = "lab/mock/out"   # a pcap/pcapng file or a directory of them
replay_speed = "max"             # "max", "realtime", or a multiplier like "10x"

[flow]
# 120 = CICFlowMeter's flow timeout: no CICIDS2017 training flow is longer.
active_timeout_seconds = 120
inactive_timeout_seconds = 60
max_flows = 100000
cleanup_interval_seconds = 30
# 5-tuples remembered when deciding "connection start" (V2_CONTRACTS §11).
connection_start_max_tracked = 100000

[features]
# Pinned schema version — bump only when pirewall/features/schema.py changes
# in a way that alters feature names/order/count (spec §11, §15).
schema_version = "2.0.0"

[detection]
known_attack_confidence_threshold = 0.8
anomaly_score_threshold = 0.0
behavior_window_seconds = 300

# Bounded state (spec §17) — caps how much memory pirewall.detection.behavior
# can use no matter how many distinct sources/destinations/ports it sees.
max_tracked_sources = 10000
max_tracked_destinations_per_source = 200
max_tracked_ports_per_source = 200
recent_connections_window = 50

# Deterministic behavioral-pattern thresholds (spec §17). Every one of
# these exists so pirewall.detection.behavior has no inline magic numbers.
repeated_connections_threshold = 20
high_frequency_per_second_threshold = 2.0
burst_window_seconds = 5.0
burst_count_threshold = 10
persistence_seconds_threshold = 1800.0
destination_diversity_threshold = 15
scanning_port_threshold = 10
repeated_failures_threshold = 10
temporal_pattern_cv_threshold = 0.15
# FLOOD: new connections/s from one source to one destination (over
# burst_window_seconds). ~12x the busiest benign client measured.
flood_connections_per_second_threshold = 100.0

# ADDENDUM_2.md B2 — slow-rate (slowloris-class) aggregate signal. A flow
# only becomes a "slow connection" candidate once open this many seconds
# while transferring at most this many bytes/second; only when
# concurrent_slow_connections_threshold many such candidates target the
# *same destination* from one source does the pattern fire.
slow_connection_min_duration_seconds = 15.0
slow_connection_max_bytes_per_second = 5.0
concurrent_slow_connections_threshold = 8

# ADDENDUM_2.md B5 — seed list of known-attack-tool JA3 fingerprints. See
# that file's own header for its source and honest staleness limitation.
known_tool_fingerprints_path = "config/known_tool_fingerprints.toml"

# ADDENDUM_2 follow-up pass, section 3 — batched Isolation Forest scoring.
# anomaly_batch_size flows are scored in one decision_function call rather
# than one call per flow; anomaly_batch_max_wait_seconds bounds how long a
# flow waits for a batch to fill under low load. See docs/ARCHITECTURE.md
# and benchmarks/2026-08-31-anomaly-batching/ for the numbers behind these
# defaults.
anomaly_batch_size = 50
anomaly_batch_max_wait_seconds = 0.2

# Source-level fast path: a source whose behavior alone already scores
# MEDIUM+ is assessed immediately (from a snapshot of an open flow) rather
# than when its first flow completes; at most once per source per this long.
source_assessment_cooldown_seconds = 10.0

[ml]
lightgbm_model_path = "pirewall/ml/artifacts/lightgbm_model.txt"
isolation_forest_model_path = "pirewall/ml/artifacts/isolation_forest_model.joblib"
feature_schema_version = "2.0.0"

[threat]
low_threshold = 25.0
medium_threshold = 50.0
high_threshold = 75.0
critical_threshold = 90.0

# Maximum 0-100 contribution each evidence type can add to the overall
# threat score (pirewall.engine.scoring). Data-informed as of model
# v0.4.0, measured on the held-out CICIDS2017 test split:
#
#   known-attack (LightGBM)    precision 0.9927, false-positive rate 0.0018
#   anomaly (Isolation Forest) precision 0.5300, false-positive rate 0.0987
#
# The anomaly detector fires correctly about half the time and at ~55x the
# classifier's false-positive rate, so at 15 it cannot reach low_threshold
# (25) on its own — it can only contribute in combination. A confident
# known-attack detection alone reaches 60: past medium (50), short of high
# (75), so enforcement still requires corroboration.
known_attack_weight = 60.0
anomaly_weight = 15.0

# Behavior: per-pattern points, summed, capped at behavior_weight. The cap
# (80) lets strong attack-shaped behavior reach HIGH -> RATE_LIMIT on its
# own and stays below critical (90), so BLOCK always needs corroboration.
# Was a flat 25 * patterns/9, which capped a real SYN flood at LOW
# (docs/KNOWN_ISSUES.md #20). Checked against observed pattern sets: one
# phone loading a page (diversity+repeated+frequency+burst) = 30, and with a
# spurious anomaly flag 45 — still LOW; the attack-lab nmap scan = 75, HIGH;
# the floods = 80 (capped), HIGH (benchmarks/2026-10-15-native-capture/LIVE_AB.md).
behavior_weight = 80.0

# ADDENDUM_2.md B4/B5 — a structural TLS protocol-field match (Heartbleed
# length mismatch, a JA3 fingerprint hit against known attack tooling).
# Weighted above known_attack_weight: a Heartbleed length mismatch is a
# near-certain structural protocol violation, not a probabilistic
# classification, so a confident match alone should already be actionable.
protocol_signature_weight = 75.0

# ADDENDUM_2.md B3 — evidence-maturity gate. A source whose evidence never
# qualifies on its own (no completed-flow classification, no
# multi-observation behavioral pattern) can still reach BLOCK/RATE_LIMIT if
# the same elevated reading recurs for this many consecutive assessment
# windows.
evidence_maturity_consistency_windows = 3
max_tracked_maturity_sources = 10000

# Interim ADDENDUM_4.md D4 ceiling on the v1 path: while false, ML evidence
# (LightGBM, Isolation Forest) can raise the reported score but cannot by
# itself cause more than MONITOR. The action comes from behavior and
# protocol-signature evidence. Both models are known to misclassify this
# network's traffic (docs/KNOWN_ISSUES.md #1, #2); leave false until they
# are retrained on it.
ml_evidence_can_enforce = false

# Points per detected behavior pattern (see behavior_weight above). Every
# pattern must be listed; the config loader rejects a missing one.
[threat.behavior_pattern_points]
scanning = 55.0
repeated_failures = 45.0
slow_rate_dos = 45.0
flood = 80.0
burst = 10.0
high_frequency = 10.0
repeated_connections = 5.0
temporal_pattern = 10.0
destination_diversity = 5.0
persistence = 0.0

[firewall]
# See docs/ADDENDUM.md for the letter references below.
enforcement_mode = "shadow"              # A1 — SHADOW is the required default for a first deployment.
assisted_review_threshold = 75.0         # A7 — BLOCK candidates >= this score need human approval in ASSISTED mode.
max_adaptive_rules_per_window = 20       # A3 — rule-creation rate cap.
rate_window_seconds = 60                 # A3 — window the cap above applies over.
default_rule_ttl_seconds = 3600
max_active_rules = 500

# spec §24 — no v1 candidate rule (single-flow evidence only) should ever
# need to be broader than this; the safety validator rejects anything wider.
min_rule_prefix_length = 24

# Packets/second allowed through a RATE_LIMIT rule before excess is dropped.
rate_limit_per_second = 10

# A2 — static allowlist. Adaptive BLOCK/RATE_LIMIT rules can never target
# these entries, regardless of threat score or enforcement mode. Empty by
# default; add entries for devices that must never be adaptively blocked
# (e.g. your own Admin PC, a home server).
allowlist = []
# Example entry (uncomment and fill in for real use):
# [[firewall.allowlist]]
# target = "192.0.2.50/32"
# reason = "CHANGE_ME — why this target is exempt"
# created_by = "CHANGE_ME"
# created_at = "2026-01-01T00:00:00Z"

[api]
host = "127.0.0.1"
port = 8443
tls_cert_path = "deploy/certificates/CHANGE_ME.crt"  # CHANGE_ME — real cert path
tls_key_path = "deploy/certificates/CHANGE_ME.key"   # CHANGE_ME — real key path, never commit the real file
cors_origins = []
history_size = 500
rpc_socket_path = "/run/pirewall/core.sock"   # ADDENDUM.md A4 — pirewall-core <-> pirewall-api
# How long pirewall-api waits for one reply from pirewall-core. Rendering
# the panel makes ~a dozen sequential calls and core serializes every RPC
# behind one lock, so this must exceed the slowest thing core can be doing
# (a portal login's scrypt), or a healthy system reports 503.
rpc_timeout_seconds = 20.0
# pirewall-api's own log directory, not logging.log_dir (pirewall-core's).
# pirewall-api.service may write only here (KNOWN_ISSUES.md #15).
log_dir = "/var/log/pirewall-api"

[authentication]
admin_username = "CHANGE_ME"
# Store a securely hashed password (spec §29), never plaintext. Generate a
# hash with pirewall's own hasher — never hand-write one, and never put the
# plaintext password here:
#   uv run python -c "from pirewall.api.auth import hash_password; \
#       import getpass; print(hash_password(getpass.getpass()))"
# (getpass keeps the password out of your shell history.)
admin_password_hash = "CHANGE_ME"
# Absolute admin-session lifetime from login. The idle timeout is
# security.session_timeout_seconds; a session ends at whichever comes first.
token_expiry_seconds = 3600

# Admin login throttle (PLAN_FINAL §4.9): failures per client IP and in
# total over the window. A locked-out attempt gets 429 with Retry-After, and
# each lockout emits an AUTHENTICATION_FAILURE event. A wrong password on
# an allowlist addition counts as a failed login. A global lockout also
# refuses the real admin until the window lapses; that is the price of
# stopping guessing from rotating or spoofed sources.
max_failed_logins_per_ip = 5
max_failed_logins_global = 20
failed_login_window_seconds = 300

[admin]
# The single PC allowed to reach administrative endpoints (spec §29).
admin_pc_ip = "192.0.2.10"   # CHANGE_ME — placeholder only

# Also permit loopback (127.0.0.1 / ::1) to reach the control panel, so an
# operator sitting at the Pi's own desktop can open it without widening
# access to a routable address (ADDENDUM_3.md C6). Loopback is unreachable
# from any network, so this grants nothing to the LAN or the WAN. Off by
# default: a deployment gets it only by asking.
allow_local_console = false

[logging]
level = "INFO"
log_dir = "/var/log/pirewall"
max_bytes = 10485760
backup_count = 5

[integration]
wazuh_enabled = false
wazuh_host = "CHANGE_ME"        # CHANGE_ME — Admin PC hostname/IP running the Wazuh server
# Wazuh's *remote syslog collector*, not 1514. 1514 is the agent connection
# service, which speaks Wazuh's own AES-encrypted, enrollment-authenticated
# agent protocol — pirewall is not an agent and sends plain JSON lines, so
# events pointed at 1514 never arrive. The 514 collector is DISABLED by
# default in Wazuh and must be enabled with the Pi's IP allowed; see
# docs/DEPLOYMENT.md §8.
wazuh_port = 514
netdata_enabled = false
netdata_host = "CHANGE_ME"      # CHANGE_ME — Admin PC hostname/IP running Netdata
netdata_port = 8125              # Netdata's StatsD listener default (not the 19999 dashboard port)

[portal]
# LAN captive portal (ADDENDUM_3.md C1-C5). When enabled, clients on the
# protected network must sign in before their traffic is forwarded. It never
# gates association, DHCP, DNS, or reaching the portal itself — any device
# can always join the AP and be shown the login page.
#
# Requires deploy/firewall/portal.nft to be loaded and pirewall-portal.service
# to be running. Enabling this without both means LAN clients are gated with
# no page to sign in on. See docs/SETUP.md.
enabled = false

# Shown on the sign-in page. Cosmetic; set it to your SSID.
network_name = "pirewall-lan"

# The Pi's LAN address and an *unprivileged* port. Port 80 reaches the portal
# through the nat redirect in portal.nft, so the process needs no
# CAP_NET_BIND_SERVICE. Must be inside network.protected_network.
listen_host = "192.168.100.1"   # CHANGE_ME — must match network.pirewall_lan_ip
listen_port = 8080

# How long a sign-in lasts. Handed to the kernel as the nftables set
# element's own timeout, so expiry costs nothing at runtime, and shown to the
# client as the countdown on the keepalive page.
session_timeout_seconds = 1800
keepalive_interval_seconds = 20

# LAN accounts, written and read by pirewall-core only (single writer).
# Manage with: python -m scripts.deployment.portal_users
user_store_path = "/var/lib/pirewall/portal_users.json"

# Its own log directory. pirewall-core and pirewall-api share
# logging.log_dir through the pirewall-ipc group; pirewall-portal is
# deliberately not in that group and cannot write there.
log_dir = "/var/log/pirewall-portal"

# A second RPC socket in its own directory and its own group. pirewall-portal
# is a member of this group only — never pirewall-ipc — so a compromise of
# the LAN-facing process cannot reach the kill switch or mutate a rule.
rpc_socket_path = "/run/pirewall-portal/portal.sock"
rpc_socket_group = "pirewall-portal-ipc"
# A portal login runs scrypt under core's single RPC lock; the generic 5s
# socket default is not enough for that. See api.rpc_timeout_seconds.
rpc_timeout_seconds = 20.0

# Online password guessing against a login anything on the AP can reach is
# cheap; scrypt alone only slows it down. Throttled per source IP, per
# account (guessing one account from many addresses) and globally, all over
# the same window. The per-account and global limits are looser than the
# per-IP one because whoever trips them locks out other people too.
max_failed_logins_per_ip = 5
failed_login_window_seconds = 300
max_failed_logins_per_account = 10
max_failed_logins_global = 50
max_sessions = 512

# pirewall-core refuses to start in ASSISTED or ACTIVE while any demo
# account (portal_users seed-demo) exists, because their passwords are
# public. Remove them with `portal_users remove-demo`. Set true only to keep
# them on purpose, e.g. in a lab. SHADOW starts either way.
allow_demo_accounts = false

# Shown on the sign-in page and appended to the block notice a device sees
# when adaptive enforcement has suspended it (ADDENDUM_3.md C4).
contact_message = "Please contact your network administrator."

[security]
min_tls_version = "TLSv1.3"
restrict_to_admin_pc = true
# Admin-session idle timeout (KNOWN_ISSUES.md #17): a session with no
# authenticated request for this long ends, even before
# authentication.token_expiry_seconds (the absolute lifetime). An open
# control-panel tab that keeps refreshing counts as activity.
session_timeout_seconds = 1800
# Optional: the Pi's address on the admin interface. When set, admin
# requests must also arrive on that local address. Defence in depth only;
# the real Admin-PC pin is the interface + MAC + IP rule in nftables.
# admin_server_address = "10.0.0.1"

[failure]
# ADDENDUM.md A6 — fail-open by default for home use, with a systemd
# watchdog to detect (not silently paper over) a crash-loop.
mode = "fail_open"
watchdog_sec = 30
crash_loop_restart_count = 3
crash_loop_window_seconds = 300

# ---------------------------------------------------------------------------
# v2 sections (docs/ADDENDUM_4.md). Every key has a default in
# pirewall/config/models.py, so a config without these sections still loads.
# `python -m scripts.deployment.migrate_config` adds them to an older
# local_config.toml.
# ---------------------------------------------------------------------------

[pipeline]
# D4 — "v1" is the merged-main pipeline and stays the default until the v2
# policy engine ships (phase 17). v1 then remains selectable as the baseline.
engine = "v1"

[guards]
# D1/D2 — static kernel guards in `table inet pirewall_static`. Rendered into
# the templates by pirewall-start; at runtime pirewall-core may change only
# the three modes below. Reviewed static policy, not adaptive rules, so they
# are not governed by [firewall] enforcement_mode (see ADDENDUM_4.md D2).
# raw = anti-spoof + per-MAC flood meters. "enforce" means enforce IF the
# bindings were seeded; otherwise it is forced to observe at startup.
raw_mode = "enforce"
input_mode = "enforce"
# Observe until the offline benign false-positive check (G5) has passed.
forward_mode = "observe"

# Meter thresholds: template starting values, to be replaced by benign
# calibration. rate and burst are ONE threshold and are fitted together (a
# burst larger than the flood hides the flood). packets/second, except
# dhcp_per_minute.
dhcp_per_minute = { rate = 10, burst = 5 }
unbound = { rate = 50, burst = 100 }
syn = { rate = 200, burst = 400 }
icmp = { rate = 50, burst = 100 }
udp_local = { rate = 500, burst = 1000 }
local_pps = { rate = 3000, burst = 6000 }
dns = { rate = 100, burst = 300 }
closed_port = { rate = 20, burst = 40 }
newconn = { rate = 100, burst = 200 }
newconn_dst = { rate = 50, burst = 100 }
udp_fwd = { rate = 20000, burst = 40000 }
# Keyless global backstops: engage when a meter set is full or many MACs
# flood together.
global_unbound = { rate = 500, burst = 1000 }
global_syn = { rate = 2000, burst = 4000 }
global_icmp = { rate = 500, burst = 1000 }
global_udp_local = { rate = 3000, burst = 6000 }
global_newconn = { rate = 1000, burst = 2000 }
portal_concurrency = 20
# The adaptive table's ratelimit_mac meter.
ratelimit = { rate = 20, burst = 40 }

# A full dynamic meter stops policing new keys, so meters are sized to at
# least twice the DHCP pool and backed by the global backstops above.
binding_set_size = 1024
meter_set_size = 256
pair_meter_set_size = 4096
offender_set_size = 4096
adaptive_set_size = 4096

[antispoof]
# D3 — IP<->MAC bindings. NetworkManager shared mode keeps its dnsmasq leases
# at /var/lib/NetworkManager/dnsmasq-<lan_interface>.leases, and lease_file
# is derived from network.lan_interface when unset, so it follows the LAN.
# Set it only for a DHCP server that writes somewhere else. Portal sign-in
# needs a binding, so a wrong path signs nobody in; pirewall-start refuses
# to bring the portal up when no running dnsmasq writes this file.
# lease_file = "/var/lib/NetworkManager/dnsmasq-<lan_interface>.leases"
# Added to a lease's expiry so a renewal written a moment late does not
# briefly unbind the device.
grace_seconds = 60
poll_seconds = 2.0
# Devices with a fixed address and no lease. Without an entry they fall into
# the tightly metered "unbound" class.
static = []
# [[antispoof.static]]
# ip = "192.0.2.20"
# mac = "02:00:00:00:00:20"
# reason = "CHANGE_ME — e.g. NAS with a static address"

[policy]
# D4 — v2 policy table. Read only when [pipeline] engine = "v2".
rate_limit_ttl_seconds = 300
block_ttl_seconds = 300
escalation_ttl_multiplier = 2     # only on NEW independent evidence
max_ttl_seconds = 3600            # every adaptive element expires; 3600 is also the ceiling
sustained_polls = 2               # an enforce-mode offender must persist this many 1 s polls; >= 2
table_path = "pirewall/policy/table.toml"   # the reviewable policy table (data, not code)
max_tracked_devices = 4096
max_evidence_ids_per_device = 256

[d1]
# D4 / PLAN_FINAL 4.5 — deterministic MAC-keyed detectors and the kernel
# poller. Read only when [pipeline] engine = "v2". Thresholds are learned
# from benign traffic (scripts/train/fit_d1_thresholds.py) and live in
# thresholds_path; core refuses ASSISTED/ACTIVE under v2 without that file.
thresholds_path = "config/d1_thresholds.toml"
windows_seconds = [10, 60]        # 3600 (1 h) is optional and cuttable
max_tracked_macs = 4096
max_tracked_destinations = 4096
max_events_per_mac = 4096
max_tracked_accounts = 1024
evaluation_cooldown_seconds = 1.0
brute_force_ports = [22, 80, 443, 8080]   # the portal port is added at runtime
brute_force_max_duration_seconds = 5.0
brute_force_size_tolerance = 0.25
failed_handshake_min_starts = 10
kernel_poll_interval_seconds = 1.0
set_fill_warning_ratio = 0.8
max_known_macs = 16384

[lab]
# D7 — provenance tag on every artifact: "pi-live", "pi-scripted", "sandbox"
# or "mock". Never defaults to a pi-* tag; pirewall-start sets it per
# --data-mode. Aggregation refuses to mix tags, and only pi-* numbers are
# Pi results.
env_tag = "sandbox"
# The on-Pi forward-path victim (pirewall-start --lab-victim up|down).
victim_netns = "labvictim"
victim_host_interface = "lab0"
victim_network = "10.250.0.0/30"
