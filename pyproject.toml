[project]
name = "pirewall"
version = "0.1.0"
description = "AI-assisted adaptive network firewall for Raspberry Pi 4"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "pydantic>=2.7",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "imbalanced-learn>=0.12",
]

[project.optional-dependencies]
# The native packet hot path (native/, Rust via PyO3). Optional: without it
# pirewall-core runs the pure-Python capture path. Building it needs a Rust
# toolchain; see docs/ARCHITECTURE.md "Native capture engine".
native = ["pirewall-native"]
# Dev/lab only (CLAUDE.md v2 dependency additions): scapy builds the frames of
# the phase-18 mock pcaps (lab/mock/gen_pcaps.py, the only importer). Never
# imported under pirewall/, never installed on the Pi's runtime path.
lab = ["scapy>=2.5"]

[tool.uv.sources]
pirewall-native = { path = "native" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pirewall"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["pirewall", "tests", "scripts", "lab"]
# docs/v2/ is the frozen v2 design bundle: its scripts are sandbox evidence
# (docs/v2/v2/RESULTS.md) and are kept byte-for-byte as tested, not linted.
extend-exclude = ["docs/v2"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "SIM", "N", "C4", "PIE", "RUF",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# lab/ entry points run as `python lab/<script>.py` (RUNBOOK_PI.md): they put
# the repo root on sys.path before importing `lab.*`/`scripts.*`.
"lab/**/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["pirewall", "lab"]

[tool.pyright]
include = ["pirewall", "tests", "scripts", "lab"]
exclude = ["**/__pycache__", "pirewall/ml/artifacts"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
# pirewall only ever runs on Linux (Raspberry Pi, spec §3/§4); pin this so
# Linux-only stdlib surface (e.g. socket.AF_PACKET in pirewall/capture/af_packet.py)
# type-checks correctly regardless of the developer's own OS.
pythonPlatform = "Linux"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
