# pirewall — runtime and state directories (ADDENDUM.md A4, ADDENDUM_3.md C1)
#
# Install to /etc/tmpfiles.d/pirewall.conf, then:
#   sudo systemd-tmpfiles --create
#
# These are declared here rather than with RuntimeDirectory=/StateDirectory=
# in the units because a unit's RuntimeDirectory entries all take that
# service's *primary* Group=, and pirewall's two RPC sockets must land in two
# *different* groups — that difference is the privilege boundary between
# pirewall-api and pirewall-portal.
#
# The portal directory is **setgid** (the leading 2 in 2750). That is what
# makes the socket bound inside it inherit group pirewall-portal-ipc without
# pirewall-core calling chown, which its own SystemCallFilter=~@privileged
# correctly forbids.

# pirewall-api reaches the privileged RPC socket here.
d /run/pirewall         0750 pirewall-core pirewall-ipc          -

# pirewall-portal reaches only this one. Setgid so the socket inherits the
# group; 0750 so nothing outside that group can even traverse in.
d /run/pirewall-portal  2750 pirewall-core pirewall-portal-ipc   -

# The captive portal's user store (ADDENDUM_3.md C3). pirewall-core is its
# only reader and writer; pirewall-portal has it under InaccessiblePaths=.
d /var/lib/pirewall     0700 pirewall-core pirewall-core         -

# Log directories. /var/log/pirewall is written by BOTH pirewall-core and
# pirewall-api, which share the pirewall-ipc group, so it needs group
# write (2770) and not just owner write. Setgid so each service's log
# file inherits the shared group rather than the writer's own.
#
# Do NOT add a logrotate drop-in for these: pirewall rotates its own logs
# via RotatingFileHandler, bounded by logging.max_bytes/backup_count. A
# second rotator recreates the files under whatever owner it is told to
# use, and the daemons then silently lose file logging and fall back to
# stderr. That had happened on the first real deployment.
d /var/log/pirewall         2770 pirewall-core   pirewall-ipc     -
d /var/log/pirewall-portal  0750 pirewall-portal pirewall-portal  -
