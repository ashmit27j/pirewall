[project]
name = "pirewall"
version = "0.1.0"
description = "AI-assisted adaptive network firewall for Raspberry Pi 4"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "pydantic>=2.7",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pirewall"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["pirewall", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "SIM", "N", "C4", "PIE", "RUF",
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["pirewall"]

[tool.pyright]
include = ["pirewall", "tests", "scripts"]
exclude = ["**/__pycache__", "pirewall/ml/artifacts"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
# pirewall only ever runs on Linux (Raspberry Pi, spec §3/§4); pin this so
# Linux-only stdlib surface (e.g. socket.AF_PACKET in pirewall/capture/af_packet.py)
# type-checks correctly regardless of the developer's own OS.
pythonPlatform = "Linux"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
